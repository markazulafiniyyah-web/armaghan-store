name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project pages (user.github.io/repo) need basePath=/repo.
      # User/org pages (user.github.io) must NOT have a basePath.
      #
      # The public site URL is normally derived from the repository name, but a
      # repository variable always wins — set it when the site is served from a
      # custom domain:
      #   Settings → Secrets and variables → Actions → Variables
      #   NEXT_PUBLIC_SITE_URL = https://your-domain.com/armaghan-store
      # It is used for canonical URLs, og:url and sitemap.xml. Pages that run
      # JavaScript re-check the address bar anyway (see components/LiveSeo.jsx).
      - name: Compute base path and site URL
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [[ "$repo" == *.github.io ]]; then
            site_url="https://${owner}.github.io"
            base=""
          else
            site_url="https://${owner}.github.io/${repo}"
            base="/${repo}"
          fi
          if [[ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]]; then
            site_url="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${base}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "Building for ${site_url} (base path: ${base:-/})"

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
